<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Paulo Henrique" />
  <meta name="description" content="Tela de login responsiva e acessível, com validação, mostrar senha e estados de carregamento." />
  <meta name="theme-color" content="#0f2027" />
  <title>Entrar — Tela de Login</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='14' y='28' width='36' height='28' rx='6' fill='%235eead4'/%3E%3Cpath d='M22 28v-6a10 10 0 0 1 20 0v6' stroke='%235eead4' stroke-width='6' fill='none'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-1: #0f2027; --bg-2: #203a43; --bg-3: #2c5364;
      --card: rgba(15, 32, 39, .72); --line: rgba(255,255,255,.12);
      --text: #eef6f8; --muted: #9fb6bd; --accent: #5eead4; --accent-ink: #062a26; --error: #fda4af;
      --ease: cubic-bezier(.16, 1, .3, 1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 1.25rem;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: var(--text);
      /* gradiente animado original, mais suave */
      background: linear-gradient(-45deg, var(--bg-1), var(--bg-2), var(--bg-3), #134e4a);
      background-size: 400% 400%; animation: gradient 14s ease infinite;
    }
    @keyframes gradient { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    body::before, body::after { content: ""; position: fixed; z-index: -1; border-radius: 50%; filter: blur(60px); opacity: .45; }
    body::before { width: 40vmax; height: 40vmax; background: #14b8a6; top: -15vmax; left: -10vmax; }
    body::after { width: 32vmax; height: 32vmax; background: #0ea5e9; bottom: -12vmax; right: -8vmax; }

    .card {
      width: min(100%, 25rem); padding: clamp(1.75rem, 6vw, 2.5rem); border-radius: 24px;
      background: var(--card); border: 1px solid var(--line);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 30px 70px rgba(0,0,0,.35); animation: rise .8s var(--ease);
    }
    @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.98); } }
    .logo { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: rgba(94,234,212,.12); color: var(--accent); margin-bottom: 1.25rem; }
    .logo svg { width: 24px; height: 24px; }
    h1 { font-size: 1.6rem; margin: 0 0 .35rem; letter-spacing: -.02em; }
    .sub { color: var(--muted); margin: 0 0 1.75rem; font-size: .95rem; }

    .field { margin-bottom: 1.1rem; }
    label { display: block; font-size: .88rem; font-weight: 600; margin-bottom: .45rem; }
    .control { position: relative; }
    .control > svg { position: absolute; left: .9rem; top: 50%; translate: 0 -50%; width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
    input[type="text"], input[type="password"] {
      width: 100%; min-height: 48px; padding: .75rem 3rem .75rem 2.75rem; font: inherit; color: var(--text);
      background: rgba(255,255,255,.06); border: 1.5px solid var(--line); border-radius: 12px;
      transition: border-color .25s, background-color .25s, box-shadow .25s;
    }
    input::placeholder { color: #6f8a92; }
    input:focus { outline: none; border-color: var(--accent); background: rgba(255,255,255,.09); box-shadow: 0 0 0 4px rgba(94,234,212,.15); }
    .field.is-invalid input { border-color: var(--error); }
    .error { color: var(--error); font-size: .82rem; margin: .4rem 0 0; min-height: 1em; }
    .toggle { position: absolute; right: .35rem; top: 50%; translate: 0 -50%; width: 40px; height: 40px; border: 0; border-radius: 10px; background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
    .toggle:hover { color: var(--text); background: rgba(255,255,255,.06); }
    .toggle svg { width: 20px; height: 20px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin: .25rem 0 1.5rem; font-size: .88rem; }
    .check { display: inline-flex; align-items: center; gap: .5rem; font-weight: 500; margin: 0; cursor: pointer; }
    .check input { width: 18px; height: 18px; accent-color: var(--accent); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .caps { color: #fcd34d; font-size: .82rem; margin: .4rem 0 0; }

    button[type="submit"] {
      width: 100%; min-height: 50px; border: 0; border-radius: 12px; font: inherit; font-weight: 700;
      background: var(--accent); color: var(--accent-ink); cursor: pointer; position: relative;
      transition: transform .3s var(--ease), background-color .25s, box-shadow .3s;
      box-shadow: 0 10px 24px rgba(94,234,212,.25);
    }
    button[type="submit"]:hover { background: #99f6e4; transform: translateY(-1px); }
    button[type="submit"]:active { transform: scale(.98); }
    button[type="submit"][aria-busy="true"] { color: transparent; pointer-events: none; }
    button[type="submit"][aria-busy="true"]::after { content: ""; position: absolute; inset: 0; margin: auto; width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid var(--accent-ink); border-right-color: transparent; animation: spin .7s linear infinite; }
    @keyframes spin { to { rotate: 360deg; } }

    .status { margin: 1rem 0 0; padding: .8rem 1rem; border-radius: 12px; font-size: .9rem; }
    .status.ok { background: rgba(94,234,212,.12); color: var(--accent); }
    .status.fail { background: rgba(253,164,175,.12); color: var(--error); }
    .shake { animation: shake .4s; }
    @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
    .foot { margin: 1.5rem 0 0; text-align: center; color: var(--muted); font-size: .88rem; }
    .demo { margin-top: 1.25rem; text-align: center; font-size: .78rem; color: #6f8a92; }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>
    </div>
    <h1>Bem-vindo de volta</h1>
    <p class="sub">Entre com seu usuário e senha para continuar.</p>

    <form id="form" novalidate>
      <div class="field">
        <label for="login">Usuário ou e-mail</label>
        <div class="control">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21a8 8 0 0 1 16 0" /></svg>
          <input type="text" id="login" name="login" placeholder="seu.usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required minlength="3" aria-describedby="login-erro" />
        </div>
        <p class="error" id="login-erro" aria-live="polite"></p>
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <div class="control">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>
          <input type="password" id="senha" name="senha" placeholder="••••••••" autocomplete="current-password" required minlength="6" aria-describedby="senha-erro caps" />
          <button type="button" class="toggle" id="toggle" aria-label="Mostrar senha" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" /><circle cx="12" cy="12" r="3" /></svg>
          </button>
        </div>
        <p class="caps" id="caps" hidden>Caps Lock está ativado</p>
        <p class="error" id="senha-erro" aria-live="polite"></p>
      </div>

      <div class="row">
        <label class="check"><input type="checkbox" id="lembrar" /> Lembrar usuário</label>
        <a href="#" id="esqueci">Esqueci a senha</a>
      </div>

      <button type="submit" id="entrar">Entrar</button>
      <p class="status" id="status" role="status" hidden></p>
    </form>

    <p class="foot">Não tem conta? <a href="#">Criar conta</a></p>
    <p class="demo">Demonstração de front-end · usuário <strong>demo</strong> · senha <strong>123456</strong></p>
  </main>

  <script>
    const form = document.getElementById("form");
    const login = document.getElementById("login");
    const senha = document.getElementById("senha");
    const toggle = document.getElementById("toggle");
    const lembrar = document.getElementById("lembrar");
    const status = document.getElementById("status");
    const entrar = document.getElementById("entrar");
    const KEY = "login:usuario";

    // lembrar só o usuário — nunca a senha
    try {
      const salvo = localStorage.getItem(KEY);
      if (salvo) { login.value = salvo; lembrar.checked = true; senha.focus(); } else { login.focus(); }
    } catch { login.focus(); }

    toggle.addEventListener("click", () => {
      const mostrar = senha.type === "password";
      senha.type = mostrar ? "text" : "password";
      toggle.setAttribute("aria-pressed", mostrar);
      toggle.setAttribute("aria-label", mostrar ? "Ocultar senha" : "Mostrar senha");
      senha.focus();
    });

    senha.addEventListener("keyup", (e) => {
      document.getElementById("caps").hidden = !(e.getModifierState && e.getModifierState("CapsLock"));
    });

    function validar(campo) {
      const erro = document.getElementById(campo.id + "-erro");
      let msg = "";
      if (!campo.value.trim()) msg = "Preencha este campo.";
      else if (campo.value.length < campo.minLength) msg = `Mínimo de ${campo.minLength} caracteres.`;
      erro.textContent = msg;
      campo.closest(".field").classList.toggle("is-invalid", !!msg);
      campo.setAttribute("aria-invalid", !!msg);
      return !msg;
    }
    [login, senha].forEach((c) => {
      c.addEventListener("blur", () => c.value && validar(c));
      c.addEventListener("input", () => c.closest(".field").classList.contains("is-invalid") && validar(c));
    });

    document.getElementById("esqueci").addEventListener("click", (e) => {
      e.preventDefault();
      mostrarStatus("ok", "Se o usuário existir, enviaremos um link de redefinição.");
    });

    function mostrarStatus(tipo, texto) {
      status.className = "status " + tipo;
      status.textContent = texto;
      status.hidden = false;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      status.hidden = true;
      const ok = [validar(login), validar(senha)].every(Boolean);
      if (!ok) {
        form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
        form.querySelector("[aria-invalid='true']").focus();
        return;
      }

      entrar.setAttribute("aria-busy", "true");
      await new Promise((r) => setTimeout(r, 900)); // simula a requisição ao servidor
      entrar.removeAttribute("aria-busy");

      try { lembrar.checked ? localStorage.setItem(KEY, login.value.trim()) : localStorage.removeItem(KEY); } catch {}

      // demonstração: em produção, a validação acontece no servidor
      if (login.value.trim().toLowerCase() === "demo" && senha.value === "123456") {
        mostrarStatus("ok", `Login realizado. Olá, ${login.value.trim()}!`);
        senha.value = "";
      } else {
        mostrarStatus("fail", "Usuário ou senha incorretos.");
        form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
        senha.select();
      }
    });
  </script>
</body>
</html>
